spring.datasource.url=${POSTGRES_URI}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET}
jwt.issuer=anima-server
jwt.access-token-expiration-minutes=15
jwt.refresh-token-expiration-days=30
# firebase storage (project anima-events); emulator-host empty = real bucket with default credentials
storage.project-id=anima-events
storage.bucket=${STORAGE_BUCKET:anima-events.firebasestorage.app}
storage.emulator-host=${STORAGE_EMULATOR_HOST:}
storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:9199}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
